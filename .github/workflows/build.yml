name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Every target is cross-assembled on Linux (see pnpm-workspace.yaml supportedArchitectures
  # and tools/package/native.ts); each artifact carries only its own native binaries.
  # Independent of `check`: a failing test reports red but never blocks the artifacts.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-debian-x64, linux-redhat-x64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache bundled Node runtime and media tools
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/talos-ng
          key: talos-runtime-${{ matrix.target }}-${{ hashFiles('tools/package/build.ts', 'tools/package/media-manifest.json') }}
      - run: pnpm package -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: talos-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
