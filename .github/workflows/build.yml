name: build

on:
  push:
    branches: [main]
  pull_request:
  # Run from main with a version (e.g. 1.0.2) to publish release v<version>; empty only builds.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (e.g. 1.0.2); empty = build only"
        required: false
        default: ""

concurrency:
  # A release run never shares a queue slot with (or is replaced by) a push run.
  group: build-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Every target is cross-assembled on Linux (see pnpm-workspace.yaml supportedArchitectures
  # and tools/package/native.ts); each artifact carries only its own native binaries.
  # Independent of `check`: a failing test reports red but never blocks the artifacts.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-debian-x64, linux-redhat-x64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache bundled Node runtime and media tools
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/talos-ng
          key: talos-runtime-${{ matrix.target }}-${{ hashFiles('tools/package/build.ts', 'tools/package/media-manifest.json') }}
      - run: pnpm package -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: talos-update-${{ matrix.target }}
          path: dist/release/update/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: talos-full-${{ matrix.target }}
          path: dist/release/full/*
          if-no-files-found: error
          compression-level: 0

  # Publishing waits for `check` too: a release is never cut from a red commit.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [check, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are cut from main only"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists"; exit 1
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      # Artifacts were uploaded from inside dist/release/{update,full}, so they merge flat.
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed-name per-platform manifests with an absolute versioned url, so
          # releases/latest/download/talos-<platform>-update.json is always current.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for m in release/talos-*-update.zip.json; do
            zip=$(basename "${m%.json}")
            platform=$(jq -er .platform "$m")
            jq -c --arg url "$base/$zip" '.url = $url' "$m" > "release/talos-$platform-update.json"
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
          # Creates the tag on the exact commit that was checked and packaged.
          gh release create "$TAG" release/* --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --latest
