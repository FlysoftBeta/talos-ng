name: build

# Commits and pull requests only test (static checks, unit tests and the browser end-to-end
# suites, in parallel); nothing is packaged. Packages are built only on a manual run:
# action "build" packages the three targets, action "release" tests, packages and publishes
# release v<version> from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "build = package the three targets; release = test, package and publish"
        type: choice
        options: [build, release]
        default: build
      version:
        description: "Release version without the v (e.g. 1.0.2); required for release"
        required: false
        default: ""

concurrency:
  # A manual run never shares a queue slot with (or is replaced by) a push run.
  group: build-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Typecheck, lint, formatting and boundaries.
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Every vitest project, one worker per available core.
  unit:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers=100%

  # The production UI suites on current Chromium and the real Chromium 70 and 80 snapshots.
  # Only the shell and client are built (the browser loads them); the server runs from source.
  e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [current, legacy, chrome80]
    env:
      TMPDIR: ${{ runner.temp }}
      TALOS_LARGE_TEST_TMPDIR: ${{ runner.temp }}
      TALOS_PACKAGE_E2E_TMPDIR: ${{ runner.temp }}
      # The packaged-host check packages releases itself: only before a release.
      TALOS_E2E_PACKAGED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser libraries (also used by the old snapshots) and the PDF renderer's libjpeg.
      - run: |
          pnpm --filter @talos/e2e exec playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends libjpeg-turbo8
      - if: matrix.engine == 'current'
        run: pnpm --filter @talos/e2e exec playwright install chromium
      - if: matrix.engine != 'current'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/talos-ng/chromium
          key: chromium-snapshots-${{ hashFiles('tools/legacy-chromium/prepare.mjs') }}
      - if: matrix.engine == 'current' && github.event_name == 'workflow_dispatch'
        name: Cache bundled Node runtime and media tools
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/talos-ng
          key: talos-runtime-e2e-${{ hashFiles('tools/package/build.ts', 'tools/package/media-manifest.json') }}
      - run: pnpm --filter @talos/shell build && pnpm --filter @talos/client build
      - run: node --import tsx tools/e2e/run.mjs ${{ matrix.engine == 'legacy' && '--legacy' || matrix.engine == 'chrome80' && '--chrome80' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-${{ matrix.engine }}-screenshots
          path: .tmp/e2e
          if-no-files-found: ignore

  # Every target is cross-assembled on Linux (see pnpm-workspace.yaml supportedArchitectures
  # and tools/package/native.ts); each artifact carries only its own native binaries.
  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-debian-x64, linux-redhat-x64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache bundled Node runtime and media tools
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/talos-ng
          key: talos-runtime-${{ matrix.target }}-${{ hashFiles('tools/package/build.ts', 'tools/package/media-manifest.json') }}
      - run: pnpm package -- --target ${{ matrix.target }}
      # Same sources for every target: one zip, published with the release for tools/sourcemap.
      - name: Collect source maps
        if: matrix.target == 'linux-debian-x64'
        run: |
          mkdir -p sm/source-maps
          cp -r packages/client/dist/source-maps/. sm/source-maps/
          for d in sm/source-maps/*/; do cp packages/server/dist/server.js.map "$d"; done
          (cd sm && zip -qr talos-sourcemaps.zip source-maps)
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.target == 'linux-debian-x64'
        with:
          name: talos-sourcemaps
          path: sm/talos-sourcemaps.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: talos-update-${{ matrix.target }}
          path: dist/release/update/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: talos-full-${{ matrix.target }}
          path: dist/release/full/*
          if-no-files-found: error
          compression-level: 0

  # Publishing waits for every test job and every package: never cut from a red commit.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'release'
    needs: [lint, unit, e2e, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are cut from main only"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists"; exit 1
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      # Artifacts were uploaded from inside dist/release/{update,full}, so they merge flat.
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed-name per-platform manifests with an absolute versioned url, so
          # releases/latest/download/talos-<platform>-update.json is always current.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for m in release/talos-*-update.zip.json; do
            zip=$(basename "${m%.json}")
            platform=$(jq -er .platform "$m")
            jq -c --arg url "$base/$zip" '.url = $url' "$m" > "release/talos-$platform-update.json"
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
          # Creates the tag on the exact commit that was checked and packaged.
          gh release create "$TAG" release/* --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --latest
