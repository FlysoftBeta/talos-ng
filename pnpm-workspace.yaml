packages:
  - packages/*
  - tools/*
# Releases are cross-assembled from Linux: install the win32 native packages too (sharp's
# @img/sharp-win32-x64) so the lockfile pins and checks their integrity; package.ts copies
# only the target platform's files into each artifact.
supportedArchitectures:
  os: [current, win32]
  cpu: [x64]
  libc: [glibc]
allowBuilds:
  core-js: false
  esbuild: true
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - "@vitest/coverage-v8@5.0.4"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - typescript-eslint@8.71.2
  - vitest@5.0.4

# Installation is explicit; scripts never mutate the lockfile.
verifyDepsBeforeRun: false
